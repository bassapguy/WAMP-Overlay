name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish, such as v1.0.0
        required: true
        default: v1.0.0
        type: string

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Resolve release tag
        id: resolve-tag
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:DISPATCH_RELEASE_TAG
          } else {
            $tag = $env:REF_NAME
          }
          $tag = ([string]$tag).Trim()

          if ([string]::IsNullOrWhiteSpace($tag) -or $tag -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release tag must be a version tag such as v1.0.0; received '$tag'. For manual runs, enter the release_tag input."
          }

          "release_tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-tag.outputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: october-wamp-installer/package-lock.json

      - name: Install dependencies
        working-directory: october-wamp-installer
        run: npm ci

      - name: Check tag matches app version and configure updater feed
        working-directory: october-wamp-installer
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ steps.resolve-tag.outputs.release_tag }}
        run: node scripts/prepare-github-release.cjs

      - name: Run tests
        working-directory: october-wamp-installer
        run: npm test

      - name: Build application bundles
        working-directory: october-wamp-installer
        run: npm run build

      - name: Create or reuse GitHub release
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.resolve-tag.outputs.release_tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const tagName = process.env.RELEASE_TAG;

            async function findRelease() {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: tagName });
                return data;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }

            let release = await findRelease();
            if (release?.draft) {
              throw new Error(`Release ${tagName} exists as a draft; publish or remove the draft before continuing.`);
            }

            if (!release) {
              try {
                const { data } = await github.rest.repos.createRelease({
                  owner,
                  repo,
                  tag_name: tagName,
                  name: tagName,
                  draft: false,
                  prerelease: false,
                  generate_release_notes: false,
                  body: `Automated Windows release for ${tagName}.`
                });
                release = data;
                core.info(`Created GitHub release ${tagName}.`);
              } catch (error) {
                if (error.status !== 422) throw error;
                release = await findRelease();
                if (!release) throw error;
                core.info(`Release ${tagName} was created concurrently; reusing it.`);
              }
            } else {
              core.info(`Reusing existing GitHub release ${tagName}.`);
            }

      - name: Publish NSIS installer and updater metadata
        working-directory: october-wamp-installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          EP_GH_IGNORE_TIME: 'true'
        run: npx electron-builder --win nsis --publish always
