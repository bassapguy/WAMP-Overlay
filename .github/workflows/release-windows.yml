name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: october-wamp-installer/package-lock.json

      - name: Install dependencies
        working-directory: october-wamp-installer
        run: npm ci

      - name: Check tag matches app version and configure updater feed
        working-directory: october-wamp-installer
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/prepare-github-release.cjs

      - name: Run tests
        working-directory: october-wamp-installer
        run: npm test

      - name: Build application bundles
        working-directory: october-wamp-installer
        run: npm run build

      - name: Publish NSIS installer and updater metadata
        working-directory: october-wamp-installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npx electron-builder --win nsis --publish always
